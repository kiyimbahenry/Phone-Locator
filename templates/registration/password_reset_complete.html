{% extends "base.html" %}
{% block title %}Password set · Phone-Locator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 text-center">
    <div class="inline-flex h-14 w-14 rounded-full bg-emerald-100 items-center justify-center mb-4">
        <svg class="h-7 w-7 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
        </svg>
    </div>
    <h1 class="text-2xl font-semibold text-slate-900 mb-2">Password updated</h1>
    <p class="text-sm text-slate-500 mb-8">
        Your password has been set. You can log in now.
    </p>
    <a href="{% url 'dashboard:login' %}"
       class="inline-block rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-emerald-700 transition">
        Log in
    </a>
</div>
{% endblock %}
