{% extends "base.html" %}
{% block title %}Check your email · Phone-Locator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 text-center">
    <div class="inline-flex h-14 w-14 rounded-full bg-emerald-100 items-center justify-center mb-4">
        <svg class="h-7 w-7 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
        </svg>
    </div>
    <h1 class="text-2xl font-semibold text-slate-900 mb-2">Check your email</h1>
    <p class="text-sm text-slate-500">
        If an account exists for that address, we've sent a link to reset your password.
        The link expires in 1 hour.
    </p>

    <a href="{% url 'dashboard:login' %}"
       class="mt-8 inline-block text-emerald-600 hover:text-emerald-700 text-sm font-medium">
        ← Back to login
    </a>
</div>
{% endblock %}
