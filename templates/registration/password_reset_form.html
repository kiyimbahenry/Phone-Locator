{% extends "base.html" %}
{% block title %}Reset password · Phone-Locator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <h1 class="text-2xl font-semibold text-slate-900 text-center mb-2">Reset your password</h1>
    <p class="text-sm text-slate-500 text-center mb-8">
        Enter the email you used to register. We'll send you a link to set a new password.
    </p>

    <form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm p-8 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
            <input type="email" name="email" required
                   class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                   placeholder="you@example.com">
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-emerald-700 transition">
            Send reset link
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
        <a href="{% url 'dashboard:login' %}" class="text-emerald-600 hover:text-emerald-700 font-medium">
            ← Back to login
        </a>
    </p>
</div>
{% endblock %}
