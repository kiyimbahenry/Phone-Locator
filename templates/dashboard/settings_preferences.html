{% extends "base.html" %}
{% block title %}Preferences · Settings{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'dashboard:settings' %}" class="text-sm text-emerald-600 hover:text-emerald-700 font-medium">
        ← Back to Settings
    </a>
</div>

<div class="max-w-2xl">
    <h1 class="text-2xl font-semibold text-slate-900 mb-2">Preferences</h1>
    <p class="text-sm text-slate-500 mb-6">Language, time zone, and appearance.</p>

    <form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        {% csrf_token %}
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Language</label>
                {{ form.language }}
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Time zone</label>
                {{ form.timezone }}
            </div>
            <label class="flex items-center gap-3 cursor-pointer">
                {{ form.dark_mode }}
                <span class="text-sm text-slate-700">Enable dark mode</span>
            </label>
        </div>

        <div class="border-t border-slate-200 bg-slate-50 px-6 py-4 flex justify-end">
            <button type="submit"
                    class="rounded-lg bg-emerald-600 px-5 py-2 text-sm font-medium text-white hover:bg-emerald-700 transition">
                Save preferences
            </button>
        </div>
    </form>
</div>
{% endblock %}
