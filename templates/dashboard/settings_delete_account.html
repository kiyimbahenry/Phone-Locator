{% extends "base.html" %}
{% block title %}Delete account · Settings{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'dashboard:settings_privacy' %}" class="text-sm text-emerald-600 hover:text-emerald-700 font-medium">
        ← Back to Privacy & Data
    </a>
</div>

<div class="max-w-lg">
    <h1 class="text-2xl font-semibold text-red-700 mb-2">Delete your account</h1>
    <p class="text-sm text-slate-500 mb-6">
        This is permanent. Your devices, locations, children profiles, and history will be deleted.
    </p>

    <form method="post" class="bg-white rounded-xl border border-red-200 shadow-sm overflow-hidden">
        {% csrf_token %}
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">
                    Type your username <strong>{{ user.username }}</strong> to confirm
                </label>
                <input type="text" name="confirm" required autocomplete="off"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
            </div>
        </div>
        <div class="border-t border-red-100 bg-red-50 px-6 py-4 flex items-center justify-end gap-3">
            <a href="{% url 'dashboard:settings_privacy' %}"
               class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Cancel
            </a>
            <button type="submit"
                    class="rounded-lg bg-red-600 px-5 py-2 text-sm font-medium text-white hover:bg-red-700 transition">
                Delete forever
            </button>
        </div>
    </form>
</div>
{% endblock %}
